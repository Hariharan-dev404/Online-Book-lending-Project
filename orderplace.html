<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – All Orders</title>
  <link rel="icon" type="image/jpeg" href="obl.jpg?v=2">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/custom_alert.css">
  <style>
    body { background: #F8F9FA; margin: 0; padding: 0; }
    
    /* Layout */
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
    .sidebar-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .sidebar-brand { font-size: 18px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.02em; }
    .sidebar-nav { padding: 24px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); font-weight: 600; font-size: 14px; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--bg-base); color: var(--text-dark); }
    .nav-item.active { background: rgba(109,76,65,0.08); color: var(--color-primary); }
    .nav-icon { font-size: 18px; }
    
    .sidebar-footer { padding: 24px; border-top: 1px solid var(--border-color); }
    
    /* Main Content */
    .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }
    
    /* Topbar */
    .topbar { height: 72px; background: white; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
    .topbar-title { font-size: 20px; font-weight: 700; color: var(--text-dark); }
    
    /* Content Area */
    .content-area { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }

    /* Cards */
    .admin-card { background: white; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 24px; overflow: hidden; }
    .admin-card-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(248,249,250,0.5); }
    .admin-card-title { font-size: 16px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }

    /* Tables */
    .table-responsive { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
    .admin-table th { padding: 14px 24px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border-color); background: rgba(248,249,250,0.5); white-space: nowrap; }
    .admin-table td { padding: 16px 24px; font-size: 14px; color: var(--text-body); border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .admin-table tbody tr { transition: background 0.15s; }
    .admin-table tbody tr:hover { background: rgba(109,76,65,0.02); }
    
    .table-img { width: 48px; height: 68px; object-fit: cover; border-radius: 6px; box-shadow: var(--shadow-sm); }
    
    .status-tag { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em; }
    .tag-success { background: rgba(16,185,129,0.1); color: #059669; }
    .tag-info { background: rgba(59,130,246,0.1); color: #2563EB; }
    
    .loading-state { padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }
    .empty-state { padding: 60px 40px; text-align: center; color: var(--text-muted); }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

    @media (max-width: 992px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="obl.jpg" alt="Logo" class="sidebar-logo">
        <div class="sidebar-brand">PageLoft Admin</div>
      </div>
      <nav class="sidebar-nav">
        <a href="admindash.html" class="nav-item">
          <span class="nav-icon">📚</span> Inventory
        </a>
        <a href="admindash.html" class="nav-item">
          <span class="nav-icon">💳</span> Orders & Payments
        </a>
        <button class="nav-item active">
          <span class="nav-icon">📋</span> All Orders (Archive)
        </button>
        <a href="adminuser.html" class="nav-item" style="color:var(--text-muted); margin-top:24px;">
          <span class="nav-icon">🏠</span> Back to Store
        </a>
      </nav>
      <div class="sidebar-footer">
        <div style="font-size:12px; color:var(--text-muted);">Signed in as</div>
        <div style="font-weight:600; color:var(--text-dark);" id="adminNameDisplay">Admin</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <button id="mobileSidebarToggle" style="display:none; background:none; border:none; font-size:24px; cursor:pointer;" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <div class="topbar-title">Order Archive</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="signOut()" style="background:var(--color-danger); border-color:var(--color-danger);">Sign Out</button>
      </header>

      <div class="content-area">
        
        <div class="admin-card">
          <div class="admin-card-header">
            <div class="admin-card-title"><span>📦</span> Verified Orders</div>
            <input type="text" id="orderSearch" onkeyup="filterOrders()" placeholder="Search archive..." style="padding:8px 16px; border:1px solid var(--border-color); border-radius:20px; font-size:13px; width:250px;">
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Customer Details</th>
                  <th>Delivery Address</th>
                  <th>Txn ID</th>
                  <th>Verified Date</th>
                </tr>
              </thead>
              <tbody id="orders-table">
                <tr><td colspan="5"><div class="loading-state">Loading archive...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div id="pgl-toast-container"></div>
  <script src="assets/custom_alert.js"></script>
  <script>
    if (window.innerWidth <= 992) {
      document.getElementById('mobileSidebarToggle').style.display = 'block';
    }

    document.addEventListener("DOMContentLoaded", async function() {
      // Verify Auth
      try {
        const authResponse = await fetch("http://localhost:8000/api/user/", { credentials: "include" });
        if (!authResponse.ok) { window.location.href = "index.html"; return; }
        const userData = await authResponse.json();
        if (userData.role !== 'admin') {
          await showCustomAlert("Access denied. Admin role required.");
          window.location.href = "user.html";
          return;
        }
        document.getElementById("adminNameDisplay").textContent = userData.name || "Admin";
      } catch (err) {
        window.location.href = "index.html";
        return;
      }

      loadAllSuccessOrders();
    });

    async function signOut() {
      try {
        await fetch("http://localhost:8000/api/logout/", { method: "POST", credentials: "include" });
      } catch (e) { console.error("Error logging out", e); }
      window.location.href = "index.html";
    }

    async function loadAllSuccessOrders() {
      try {
        const response = await fetch("http://localhost:8000/api/orders/", { credentials: "include" });
        if (!response.ok) throw new Error("Failed to fetch orders from API.");
        
        const allOrders = await response.json();
        const successOrders = allOrders.filter(o => o.payment_status === 'success');
        const tbody = document.getElementById("orders-table");
        tbody.innerHTML = "";

        if (successOrders.length === 0) {
           tbody.innerHTML = `<tr><td colspan='5'><div class="empty-state"><div class="empty-state-icon">📋</div><h3>No Verified Orders</h3><p>There are no successful orders in the archive yet.</p></div></td></tr>`;
           return;
        }

        successOrders.forEach(order => {
          let imgPath = "obl.jpg";
          let bookTitle = "Unknown Book";
          let bookAuthor = "Unknown";
          
          if (order.book_details) {
            bookTitle = order.book_details.title;
            bookAuthor = order.book_details.author;
            if (order.book_details.image) {
              imgPath = order.book_details.image.startsWith('http') ? order.book_details.image : 'http://localhost:8000' + order.book_details.image;
            }
          }

          const createdDate = new Date(order.created_at).toLocaleString();
          const txnID = order.transaction_id || "N/A";
          
          let typeLabel = order.order_type === "lend" 
            ? `<span class="status-tag tag-info">LEND (${order.duration || '?'} WEEKS)</span>`
            : `<span class="status-tag tag-success">BUY</span>`;

          let addressContent = order.order_type === "lend"
            ? `${order.address}`
            : `${order.address}<br>${order.city}, ${order.state} - ${order.pincode}`;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <div style="display:flex; align-items:center; gap:12px;">
                <img src="${imgPath}" class="table-img" alt="Book">
                <div>
                  <div style="font-weight:700; color:var(--text-dark);">${bookTitle}</div>
                  <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">by ${bookAuthor}</div>
                  ${typeLabel}
                </div>
              </div>
            </td>
            <td>
              <div style="font-weight:600; color:var(--text-dark);">${order.user_name}</div>
              <div style="font-size:12px; color:var(--text-muted);">Ord: #${order.id}</div>
            </td>
            <td><div style="font-size:13px; max-width:250px; line-height:1.4;">${addressContent}</div></td>
            <td><div style="font-size:13px; font-family:monospace; background:var(--bg-base); padding:4px 8px; border-radius:4px; display:inline-block;">${txnID}</div></td>
            <td><div style="font-size:13px; color:var(--text-muted);">${createdDate}</div></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Error generating success orders:", err);
        document.getElementById("orders-table").innerHTML = `<tr><td colspan='5'><div class="empty-state">Failed to load archive.</div></td></tr>`;
      }
    }

    function filterOrders() {
      const input = document.getElementById("orderSearch").value.toLowerCase();
      document.querySelectorAll("#orders-table tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
      });
    }
  </script>
</body>
</html>
