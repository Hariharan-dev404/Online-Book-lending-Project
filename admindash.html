<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – PageLoft</title>
  <link rel="icon" type="image/jpeg" href="obl.jpg?v=2">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/custom_alert.css">
  <style>
    body { background: #F8F9FA; margin: 0; padding: 0; }
    
    /* Layout */
    .admin-layout { display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: white; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 100; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
    .sidebar-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .sidebar-brand { font-size: 18px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.02em; }
    .sidebar-nav { padding: 24px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: var(--text-muted); font-weight: 600; font-size: 14px; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--bg-base); color: var(--text-dark); }
    .nav-item.active { background: rgba(109,76,65,0.08); color: var(--color-primary); }
    .nav-icon { font-size: 18px; }
    
    .sidebar-footer { padding: 24px; border-top: 1px solid var(--border-color); }
    
    /* Main Content */
    .main-content { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-width: 0; }
    
    /* Topbar */
    .topbar { height: 72px; background: white; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 90; }
    .topbar-title { font-size: 20px; font-weight: 700; color: var(--text-dark); }
    
    /* Content Area */
    .content-area { padding: 32px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .tab-pane { display: none; animation: fadeIn 0.3s ease; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards */
    .admin-card { background: white; border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 24px; overflow: hidden; }
    .admin-card-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(248,249,250,0.5); }
    .admin-card-title { font-size: 16px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
    .admin-card-body { padding: 24px; }

    /* Forms */
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 14px; font-family: var(--font-family); transition: all 0.2s; box-sizing: border-box; background: var(--bg-base); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--color-primary); background: white; box-shadow: 0 0 0 3px rgba(109,76,65,0.1); }
    
    /* Tables */
    .table-responsive { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
    .admin-table th { padding: 14px 24px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border-color); background: rgba(248,249,250,0.5); white-space: nowrap; }
    .admin-table td { padding: 16px 24px; font-size: 14px; color: var(--text-body); border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .admin-table tbody tr { transition: background 0.15s; }
    .admin-table tbody tr:hover { background: rgba(109,76,65,0.02); }
    
    .table-img { width: 48px; height: 68px; object-fit: cover; border-radius: 6px; box-shadow: var(--shadow-sm); }
    
    /* Actions */
    .action-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: var(--font-family); }
    .btn-edit { background: rgba(245,158,11,0.1); color: #D97706; }
    .btn-edit:hover { background: rgba(245,158,11,0.2); }
    .btn-delete { background: rgba(239,68,68,0.1); color: #DC2626; }
    .btn-delete:hover { background: rgba(239,68,68,0.2); }
    .btn-verify { background: rgba(16,185,129,0.1); color: #059669; }
    .btn-verify:hover { background: rgba(16,185,129,0.2); }
    
    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 20px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; position: relative; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header { padding: 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 10; border-radius: 20px 20px 0 0; }
    .modal-body { padding: 24px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .modal-close:hover { color: var(--color-danger); }

    /* Tags */
    .status-tag { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em; }
    .tag-success { background: rgba(16,185,129,0.1); color: #059669; }
    .tag-pending { background: rgba(245,158,11,0.1); color: #D97706; }
    .tag-danger { background: rgba(239,68,68,0.1); color: #DC2626; }
    .tag-info { background: rgba(59,130,246,0.1); color: #2563EB; }

    @media (max-width: 992px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .form-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 576px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="obl.jpg" alt="Logo" class="sidebar-logo">
        <div class="sidebar-brand">PageLoft Admin</div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="switchTab('books', this)">
          <span class="nav-icon">📚</span> Inventory
        </button>
        <button class="nav-item" onclick="switchTab('payments', this)">
          <span class="nav-icon">💳</span> Orders & Payments
        </button>
        <a href="orderplace.html" class="nav-item" style="color:var(--text-muted);">
          <span class="nav-icon">📋</span> All Orders (Archive)
        </a>
        <a href="adminuser.html" class="nav-item" style="color:var(--text-muted);">
          <span class="nav-icon">🏠</span> Back to Store
        </a>
      </nav>
      <div class="sidebar-footer">
        <div style="font-size:12px; color:var(--text-muted);">Signed in as</div>
        <div style="font-weight:600; color:var(--text-dark);" id="adminNameDisplay">Admin</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <button id="mobileSidebarToggle" style="display:none; background:none; border:none; font-size:24px; cursor:pointer;" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <div class="topbar-title" id="topbarTitle">Inventory Management</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="signOut()" style="background:var(--color-danger); border-color:var(--color-danger);">Sign Out</button>
      </header>

      <div class="content-area">
        
        <!-- Books Tab -->
        <div id="books-tab" class="tab-pane active">
          
          <!-- Add Book Card -->
          <div class="admin-card">
            <div class="admin-card-header">
              <div class="admin-card-title"><span>➕</span> Add New Book</div>
            </div>
            <div class="admin-card-body">
              <div class="form-grid">
                <div class="form-group"><label>Title *</label><input type="text" id="title" placeholder="Book Title"></div>
                <div class="form-group"><label>Author *</label><input type="text" id="author" placeholder="Author Name"></div>
                <div class="form-group"><label>Genre *</label>
                  <select id="genre">
                    <option value="">Select Genre</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Romance">Romance</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Education">Education</option>
                    <option value="Others">Others</option>
                  </select>
                </div>
                <div class="form-group"><label>Buy Price (₹) *</label><input type="number" id="price" placeholder="0.00"></div>
                <div class="form-group"><label>Lending Price (₹) *</label><input type="number" id="lending_price" placeholder="0.00"></div>
                <div class="form-group"><label>Stock *</label><input type="number" id="stock" placeholder="Qty"></div>
              </div>
              <div class="form-group" style="margin-bottom:16px;"><label>Description *</label><textarea id="description" rows="3" placeholder="Book synopsis..."></textarea></div>
              
              <div style="background:var(--bg-base); padding:16px; border-radius:12px; border:1px solid var(--border-color); margin-bottom:20px;">
                <label style="display:block; font-size:12px; font-weight:700; margin-bottom:12px; color:var(--text-dark);">UPLOAD IMAGES</label>
                <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:0;">
                  <div class="form-group"><label>Main Image *</label><input type="file" id="image" accept="image/*"></div>
                  <div class="form-group"><label>Image 1</label><input type="file" id="image1" accept="image/*"></div>
                  <div class="form-group"><label>Image 2</label><input type="file" id="image2" accept="image/*"></div>
                  <div class="form-group"><label>Image 3</label><input type="file" id="image3" accept="image/*"></div>
                  <div class="form-group"><label>Image 4</label><input type="file" id="image4" accept="image/*"></div>
                  <div class="form-group"><label>Image 5</label><input type="file" id="image5" accept="image/*"></div>
                </div>
              </div>
              
              <button class="btn btn-primary" onclick="addBook()">Add Book to Inventory</button>
            </div>
          </div>

          <!-- Inventory List -->
          <div class="admin-card">
            <div class="admin-card-header">
              <div class="admin-card-title"><span>📚</span> Current Inventory</div>
              <input type="text" id="adminSearchBook" onkeyup="filterAdminBooks()" placeholder="Search books..." style="padding:8px 16px; border:1px solid var(--border-color); border-radius:20px; font-size:13px; width:250px;">
            </div>
            <div class="table-responsive">
              <table class="admin-table" id="bookTable">
                <thead>
                  <tr>
                    <th>Book</th>
                    <th>Details</th>
                    <th>Pricing</th>
                    <th>Stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Payments Tab -->
        <div id="payments-tab" class="tab-pane">
          <div class="admin-card">
            <div class="admin-card-header">
              <div class="admin-card-title"><span>💳</span> Order & Payment Verification</div>
              <input type="text" id="adminSearchOrder" onkeyup="filterAdminOrders()" placeholder="Search orders..." style="padding:8px 16px; border:1px solid var(--border-color); border-radius:20px; font-size:13px; width:250px;">
            </div>
            <div class="table-responsive">
              <table class="admin-table" id="orderTable">
                <thead>
                  <tr>
                    <th>User & Order</th>
                    <th>Item</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Tracking</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Edit Book Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="font-size:18px; font-weight:700; margin:0;">Edit Book Details</h2>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body">
        <form id="editForm" onsubmit="saveEditBook(event)">
          <div class="form-grid" style="grid-template-columns:1fr 1fr;">
            <div class="form-group"><label>Title</label><input type="text" id="edit-title" required></div>
            <div class="form-group"><label>Author</label><input type="text" id="edit-author" required></div>
            <div class="form-group"><label>Genre</label>
              <select id="edit-genre" required>
                <option value="Fiction">Fiction</option>
                <option value="Romance">Romance</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Education">Education</option>
                <option value="Others">Others</option>
              </select>
            </div>
            <div class="form-group"><label>Stock</label><input type="number" id="edit-stock" required></div>
            <div class="form-group"><label>Buy Price (₹)</label><input type="number" step="0.01" id="edit-price" required></div>
            <div class="form-group"><label>Lending Price (₹)</label><input type="number" step="0.01" id="edit-lending_price" required></div>
          </div>
          <div class="form-group"><label>Description</label><textarea id="edit-description" rows="3" required></textarea></div>
          <div class="form-group"><label>Update Main Image (Optional)</label><input type="file" id="edit-image" accept="image/*"></div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Save Changes</button>
        </form>
      </div>
    </div>
  </div>

  <div id="pgl-toast-container"></div>
  <script src="assets/custom_alert.js"></script>
  <script>
    const API_URL = 'http://localhost:8000/api/books/';
    const API_URL_ORDERS = 'http://localhost:8000/api/orders/';

    // UI Logic
    if (window.innerWidth <= 992) {
      document.getElementById('mobileSidebarToggle').style.display = 'block';
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`${tabName}-tab`).classList.add('active');
      if(btn) btn.classList.add('active');
      
      document.getElementById('topbarTitle').innerText = tabName === 'books' ? 'Inventory Management' : 'Order & Payment Verification';
      if(window.innerWidth <= 992) document.getElementById('sidebar').classList.remove('open');
    }

    // Auth & Init
    document.addEventListener("DOMContentLoaded", async function () {
      try {
        const response = await fetch("http://localhost:8000/api/user/", { credentials: "include" });
        if (!response.ok) { window.location.href = "index.html"; return; }
        const userData = await response.json();
        if (userData.role !== 'admin') {
          await showCustomAlert("Access denied. Admin privileges required.");
          window.location.href = "user.html";
          return;
        }
        document.getElementById("adminNameDisplay").textContent = userData.name || "Admin";
        loadBooks();
        loadOrders();
      } catch (e) {
        window.location.href = "index.html";
      }
    });

    async function signOut() {
      try {
        await fetch("http://localhost:8000/api/logout/", { method: "POST", credentials: "include" });
      } catch (e) { console.error("Error logging out", e); }
      window.location.href = "index.html";
    }

    // ── BOOKS LOGIC ──
    async function loadBooks() {
      try {
        const response = await fetch(API_URL);
        const books = await response.json();
        const tbody = document.querySelector("#bookTable tbody");
        tbody.innerHTML = "";

        books.forEach((book) => {
          const lendingPriceFormat = book.lending_price ? '₹' + book.lending_price : '—';
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <div style="display:flex; align-items:center; gap:12px;">
                <img src="${book.image}" class="table-img" alt="Book">
                <div>
                  <div style="font-weight:700; color:var(--text-dark);">${book.title}</div>
                  <div style="font-size:12px; color:var(--text-muted);">ID: ${book.id}</div>
                </div>
              </div>
            </td>
            <td>
              <div style="font-size:13px;">${book.author}</div>
              <div class="status-tag tag-info" style="margin-top:4px;">${book.genre}</div>
            </td>
            <td>
              <div style="font-size:13px;"><strong>Buy:</strong> ₹${book.price}</div>
              <div style="font-size:13px; margin-top:4px;"><strong>Lend:</strong> ${lendingPriceFormat}</div>
            </td>
            <td>
              <span style="font-weight:700; color:${book.stock > 0 ? 'var(--text-dark)' : 'var(--color-danger)'};">${book.stock}</span>
            </td>
            <td>
              <div style="display:flex; gap:8px;">
                <button class="action-btn btn-edit" onclick="openEditModal(${book.id}, '${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}', '${book.genre}', ${book.price}, ${book.lending_price || 0}, ${book.stock}, '${book.description.replace(/'/g, "\\'")}')">Edit</button>
                <button class="action-btn btn-delete" onclick="deleteBook(${book.id})">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) { console.error("Error loading books:", error); }
    }

    async function addBook() {
      const fields = ['title', 'author', 'genre', 'price', 'lending_price', 'stock', 'description'];
      const values = fields.map(id => document.getElementById(id).value.trim());
      const imageFile = document.getElementById("image").files[0];

      if (values.some(v => !v) || !imageFile) {
        showCustomAlert("Please fill all required fields and select a main image.");
        return;
      }

      const formData = new FormData();
      fields.forEach((id, idx) => formData.append(id, values[idx]));
      formData.append('image', imageFile);
      formData.append('status', 'available');

      for(let i=1; i<=5; i++) {
        const file = document.getElementById(`image${i}`).files[0];
        if(file) formData.append(`image${i}`, file);
      }

      try {
        const response = await fetch(API_URL, { method: 'POST', credentials: "include", body: formData });
        if (response.ok) {
          showCustomAlert("Book added successfully!");
          loadBooks();
          clearInputs();
        } else { showCustomAlert("Failed to add book."); }
      } catch (error) { console.error("Error:", error); }
    }

    function clearInputs() {
      ['title','author','genre','price','lending_price','stock','description','image','image1','image2','image3','image4','image5'].forEach(id => {
        document.getElementById(id).value = "";
      });
    }

    async function deleteBook(id) {
      if(!confirm("Are you sure you want to delete this book?")) return;
      try {
        const response = await fetch(`${API_URL}${id}/`, { method: 'DELETE', credentials: "include" });
        if (response.ok) loadBooks();
        else showCustomAlert("Failed to delete book.");
      } catch (error) { console.error("Error:", error); }
    }

    let editingBookId = null;
    function openEditModal(id, title, author, genre, price, lendingPrice, stock, desc) {
      editingBookId = id;
      document.getElementById('edit-title').value = title;
      document.getElementById('edit-author').value = author;
      document.getElementById('edit-genre').value = genre;
      document.getElementById('edit-price').value = price;
      document.getElementById('edit-lending_price').value = lendingPrice;
      document.getElementById('edit-stock').value = stock;
      document.getElementById('edit-description').value = desc;
      document.getElementById('edit-image').value = "";
      document.getElementById('editModal').style.display = 'flex';
    }
    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; editingBookId = null; }

    async function saveEditBook(event) {
      event.preventDefault();
      if (!editingBookId) return;
      const formData = new FormData();
      ['title','author','genre','price','lending_price','stock','description'].forEach(id => {
        formData.append(id.replace('edit-', ''), document.getElementById(id).value);
      });
      const imageFile = document.getElementById('edit-image').files[0];
      if (imageFile) formData.append('image', imageFile);

      try {
        const response = await fetch(`${API_URL}${editingBookId}/`, { method: 'PATCH', credentials: "include", body: formData });
        if (response.ok) {
          closeEditModal();
          loadBooks();
          showCustomAlert("Book updated.");
        } else { showCustomAlert("Failed to update book."); }
      } catch (error) { console.error("Error:", error); }
    }

    function filterAdminBooks() {
      const input = document.getElementById("adminSearchBook").value.toLowerCase();
      document.querySelectorAll("#bookTable tbody tr").forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    }

    // ── ORDERS LOGIC ──
    async function loadOrders() {
      try {
        const response = await fetch(API_URL_ORDERS, { credentials: "include" });
        const orders = await response.json();
        const tbody = document.querySelector("#orderTable tbody");
        tbody.innerHTML = "";

        orders.forEach((order) => {
          const bookTitle = order.book_details ? order.book_details.title : 'Book ID ' + order.book;
          let screenshotHTML = order.payment_screenshot 
            ? `<a href="${order.payment_screenshot.startsWith('http') ? order.payment_screenshot : 'http://localhost:8000'+order.payment_screenshot}" target="_blank" style="color:var(--color-primary); font-size:12px; font-weight:600; text-decoration:underline;">View Receipt</a>` 
            : `<span style="font-size:12px; color:var(--text-muted);">No receipt</span>`;

          let actionHTML = "";
          let statusTag = "";
          
          if (order.payment_status === 'pending') {
            statusTag = `<span class="status-tag tag-pending">Pending Verification</span>`;
            actionHTML = `
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="action-btn btn-verify" onclick="processOrder(${order.id}, 'verify')">Verify</button>
                <button class="action-btn btn-delete" onclick="processOrder(${order.id}, 'reject')">Reject</button>
              </div>`;
          } else if (order.payment_status === 'rejected') {
            statusTag = `<span class="status-tag tag-danger">Rejected</span>`;
          } else {
            statusTag = `<span class="status-tag tag-success">Verified</span>`;
          }

          let typeDisplay = `<span class="status-tag tag-info">${order.order_type.toUpperCase()}</span>`;
          if (order.order_type === 'lend' && order.duration) typeDisplay += `<div style="font-size:11px; margin-top:4px;">${order.duration} Weeks</div>`;

          let amountBreakdown = order.order_type === 'lend' 
            ? `Fee: ₹${order.lending_fee || 0}<br>Dep: ₹${order.deposit_amount || 0}<br><strong>Tot: ₹${order.total_amount || 0}</strong>`
            : `Qty: ${order.quantity || 1}<br><strong>Tot: ₹${order.total_amount || 0}</strong>`;

          let trackingHTML = `
            <div style="display:flex; flex-direction:column; gap:4px; max-width:140px;">
              <input type="text" id="track-${order.id}" value="${order.tracking_id || ''}" placeholder="Tracking ID" style="padding:4px 8px; font-size:12px; border:1px solid var(--border-color); border-radius:4px;">
              <select id="status-${order.id}" style="padding:4px; font-size:12px; border:1px solid var(--border-color); border-radius:4px;">
                <option value="pending" ${order.delivery_status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="shipped" ${order.delivery_status === 'shipped' ? 'selected' : ''}>Shipped</option>
              </select>
              <button onclick="updateTracking(${order.id})" class="action-btn" style="background:var(--color-primary); color:white; margin-top:4px;">Save</button>
            </div>
          `;

          if (order.order_type === 'lend' && order.refund_status === 'pending') {
            actionHTML += `<button class="action-btn" onclick="refundDeposit(${order.id})" style="background:#F59E0B; color:white; margin-top:8px; width:100%;">Refund Deposit</button>`;
          } else if (order.order_type === 'lend' && order.refund_status === 'completed') {
            actionHTML += `<div style="color:#059669; font-size:11px; font-weight:700; margin-top:8px;">✅ DEPOSIT REFUNDED</div>`;
          }

          const tr = document.createElement("tr");
          tr.setAttribute("data-order-id", order.id);
          tr.innerHTML = `
            <td>
              <div style="font-weight:600; color:var(--text-dark);">${order.user_name}</div>
              <div style="font-size:11px; color:var(--text-muted);">Ord: #${order.id} | Txn: ${order.transaction_id || 'N/A'}</div>
            </td>
            <td>
              <div style="font-size:13px; font-weight:600;">${bookTitle}</div>
              ${screenshotHTML}
            </td>
            <td>${typeDisplay}</td>
            <td style="font-size:13px;">${amountBreakdown}</td>
            <td>${statusTag}</td>
            <td>${trackingHTML}</td>
            <td>${actionHTML}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) { console.error("Error loading orders:", error); }
    }

    async function processOrder(orderId, actionType) {
      if(!confirm(`Are you sure you want to ${actionType} this payment?`)) return;
      try {
        const response = await fetch(`http://localhost:8000/api/verify-payment/${orderId}/`, {
          method: 'POST', credentials: "include", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType })
        });
        if (response.ok) {
          showCustomAlert(`Order successfully processed as: ${actionType}`);
          loadOrders();
          if (actionType === 'verify') loadBooks();
        } else { showCustomAlert("Failed to verify payment natively."); }
      } catch (error) { console.error("Error:", error); }
    }

    function filterAdminOrders() {
      const input = document.getElementById("adminSearchOrder").value.toLowerCase();
      document.querySelectorAll("#orderTable tbody tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
      });
    }

    async function updateTracking(orderId) {
      const trackId = document.getElementById(`track-${orderId}`).value;
      const dStatus = document.getElementById(`status-${orderId}`).value;
      try {
        const res = await fetch(`http://localhost:8000/api/admin/orders/${orderId}/tracking/`, {
          method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracking_id: trackId, delivery_status: dStatus })
        });
        if (res.ok) showCustomAlert('Tracking updated successfully!');
        else showCustomAlert('Failed to update tracking.');
      } catch (err) { console.error(err); }
    }

    async function refundDeposit(orderId) {
      if (!confirm('Are you sure you want to refund the deposit?')) return;
      try {
        const res = await fetch(`http://localhost:8000/api/admin/orders/${orderId}/refund/`, { method: 'POST', credentials: 'include' });
        if (res.ok) { showCustomAlert('Deposit refunded successfully!'); loadOrders(); }
        else showCustomAlert('Failed to refund deposit.');
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
