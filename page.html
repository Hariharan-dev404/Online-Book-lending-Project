<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details – PageLoft</title>
  <link rel="icon" type="image/jpeg" href="obl.jpg?v=2">
  
  <!-- CSS Library -->
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/custom_alert.css">
  
  <style>
    body {
      background: var(--bg-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .main-content {
      flex: 1;
      padding: 60px 0 100px;
    }

    /* Redesigned Details Card */
    .details-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 48px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      box-shadow: var(--shadow-lg);
      align-items: start;
    }

    .book-cover-panel {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      background: var(--bg-base);
      aspect-ratio: 2/3;
      border: 1px solid var(--border-color);
    }
    
    .book-cover-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .book-info-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .details-genre {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-accent);
      margin-bottom: 12px;
    }

    .details-title {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .details-author {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .details-divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    .details-description {
      font-size: 15px;
      color: var(--text-body);
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .pricing-and-actions {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-top: auto;
      flex-wrap: wrap;
    }

    .pricing-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pricing-box .buy-price {
      font-size: 28px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .pricing-box .lend-price {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .action-buttons-wrap {
      display: flex;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .details-layout {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 32px 24px;
      }
      .book-cover-panel {
        max-width: 240px;
        margin: 0 auto;
      }
      .details-title {
        font-size: 28px;
      }
      .pricing-and-actions {
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
      }
      .action-buttons-wrap {
        width: 100%;
      }
      .action-buttons-wrap button {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="pgl-navbar" id="mainNavbar">
    <div class="pgl-navbar-inner">
      <a href="index.html" class="pgl-navbar-brand">
        <img src="obl.jpg" alt="Logo" class="pgl-navbar-logo">
        <span class="pgl-navbar-name">PageLoft</span>
      </a>
      <div class="pgl-navbar-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">← Back to Store</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div class="container">
      <div class="details-layout">
        
        <!-- Cover -->
        <div class="book-cover-panel">
          <img id="book-image" src="" alt="Book Cover">
        </div>

        <!-- Info -->
        <div class="book-info-panel">
          <div class="details-genre" id="book-genre">General</div>
          <h1 class="details-title" id="book-title">Loading book title...</h1>
          <p class="details-author" id="book-author"></p>
          
          <hr class="details-divider">
          
          <div class="details-description" id="book-description">
            <p>Please wait while we retrieve the details for this title.</p>
          </div>
          
          <hr class="details-divider">

          <div class="pricing-and-actions">
            <div class="pricing-box">
              <div class="buy-price" id="price-display">₹0</div>
              <div class="lend-price" id="lending-price-display">Lend option not available</div>
            </div>
            
            <div class="action-buttons-wrap">
              <button class="btn btn-outline btn-lg" id="lend-btn">Borrow Book</button>
              <button class="btn btn-primary btn-lg" id="buy-btn">Buy Now</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="pgl-footer">
    <div class="container">
      <div class="pgl-footer-bottom" style="margin: 0; padding: 0; border: none;">
        <p>© 2025 PageLoft. All rights reserved. Made with ❤️ for book lovers.</p>
      </div>
    </div>
  </footer>

  <script src="assets/custom_alert.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        window.location.href = "index.html";
        return;
      }

      try {
        const response = await fetch(`http://localhost:8000/api/books/${id}/`);
        if (response.ok) {
          const book = await response.json();
          document.title = `${book.title} – PageLoft`;
          
          document.getElementById("book-image").src = book.image || 'https://via.placeholder.com/300x450?text=No+Cover';
          document.getElementById("book-title").textContent = book.title;
          document.getElementById("book-author").textContent = "by " + book.author;
          document.getElementById("book-genre").textContent = book.genre || "General";
          document.getElementById("book-description").innerHTML = `<p>${book.description || 'No description available.'}</p>`;
          
          document.getElementById("price-display").textContent = `₹${book.price}`;
          
          const lendDisplay = document.getElementById("lending-price-display");
          if (book.lending_price && book.lending_price > 0) {
            lendDisplay.textContent = `Lend for only ₹${book.lending_price}/week`;
          } else {
            lendDisplay.textContent = "Purchase Only";
            document.getElementById("lend-btn").style.display = "none";
          }

          document.getElementById("buy-btn").onclick = () => {
            window.location.href = `buy.html?id=${book.id}`;
          };
          document.getElementById("lend-btn").onclick = () => {
            window.location.href = `lend.html?id=${book.id}`;
          };
        } else {
          showCustomAlert("We couldn't retrieve details for this book.");
          setTimeout(() => { window.location.href = "index.html"; }, 1500);
        }
      } catch (error) {
        console.error("Error fetching book details:", error);
        showCustomAlert("Error fetching book details.");
      }
    });
  </script>
</body>
</html>
